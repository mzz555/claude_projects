<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>弹珠单位生成系统</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#080808;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;font-family:monospace;gap:12px;}
  canvas{display:block;border:1px solid #00ff6633;box-shadow:0 0 40px #00ff6618;}
  #ctrl{
    display:flex;align-items:center;gap:14px;
    background:#0e1a0e;border:1px solid #00ff6633;
    border-radius:6px;padding:10px 20px;
    color:#00ff66;font-size:13px;
    box-shadow:0 0 16px #00ff6612;
  }
  #ctrl label{white-space:nowrap;letter-spacing:.05em;}
  #ctrl .val{
    min-width:52px;text-align:center;
    color:#fff;font-size:14px;font-weight:bold;
    text-shadow:0 0 8px #00ff66;
  }
  #ctrl input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:220px;height:4px;background:#1a3a1a;
    border-radius:2px;outline:none;cursor:pointer;
  }
  #ctrl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:#00ff66;
    box-shadow:0 0 8px #00ff66;cursor:pointer;
  }
  #ctrl button{
    background:#0e1a0e;border:1px solid #00ff6655;
    color:#00ff66;font:bold 16px monospace;
    width:30px;height:30px;border-radius:4px;
    cursor:pointer;line-height:1;
    transition:background .1s;
  }
  #ctrl button:hover{background:#003300;border-color:#00ff66;}
</style>
</head>
<body>
<canvas id="c" width="700" height="500"></canvas>
<div id="ctrl">
  <label>发射频率</label>
  <button id="btn-slow">−</button>
  <input type="range" id="freq-slider" min="60" max="480" step="20" value="180">
  <button id="btn-fast">+</button>
  <span class="val" id="freq-val">3.0 s</span>
</div>
<script>
'use strict';
// ── 常量 ─────────────────────────────────────────────────────────────────
const GRAVITY      = 0.38;
const MAX_SPEED    = 34;
const BOUNCE_WALL  = 0.88;
const BOUNCE_OBS   = 0.90;
const FLOOR_BOUNCE = 0.82;
const FIRE_SPEED   = 13.5;
let   FIRE_INT     = 180;
const TRAIL_LEN    = 14;
const GREEN        = '#00ff66';
const GREEN_DIM    = '#009944';
const TOP_H        = 255;
const BOT_H        = 245;
const W = 700, H = 500;
const TGT_ZONE_H   = 40;
const TOP_TGT_Y    = TOP_H - TGT_ZONE_H;          // 215
const BOT_TGT_Y    = H   - TGT_ZONE_H;            // 460
const SWEEP_TOP_Y  = TOP_TGT_Y - 28;              // 187  sweeper行y
const SWEEP_BOT_Y  = BOT_TGT_Y - 28;              // 432
const OBS_MAX_TOP  = SWEEP_TOP_Y - 14 - 6;        // 167  障碍物中心最大y
const OBS_MAX_BOT  = SWEEP_BOT_Y - 13 - 6;        // 413
const TOP_FLOOR    = TOP_H - 2;
const BOT_FLOOR    = H   - 2;

// ── Vec2 ─────────────────────────────────────────────────────────────────
class Vec2{
  constructor(x=0,y=0){this.x=x;this.y=y;}
  add(v){return new Vec2(this.x+v.x,this.y+v.y);}
  scale(s){return new Vec2(this.x*s,this.y*s);}
  dot(v){return this.x*v.x+this.y*v.y;}
  len(){return Math.sqrt(this.x*this.x+this.y*this.y);}
  clone(){return new Vec2(this.x,this.y);}
}

// ── Marble ────────────────────────────────────────────────────────────────
class Marble{
  constructor(x,y,vx,vy,container='top'){
    this.pos=new Vec2(x,y);this.vel=new Vec2(vx,vy);
    this.r=7;this.trail=[];
    this.state='active';this.container=container;
    this.hitCD=0;this.age=0;
  }
  update(allObs,sweepers,tb,bb){
    if(this.state==='dead')return;
    this.age++;
    this.vel.y+=GRAVITY;
    const spd=this.vel.len();
    if(spd>MAX_SPEED){const f=MAX_SPEED/spd;this.vel.x*=f;this.vel.y*=f;}
    this.pos.x+=this.vel.x;this.pos.y+=this.vel.y;
    this.trail.push(this.pos.clone());
    if(this.trail.length>TRAIL_LEN)this.trail.shift();
    if(this.hitCD>0)this.hitCD--;
    // 永不消失（只有容器2目标区才触发死亡）
    const b=this.container==='top'?tb:bb;
    this._wallBounce(b);
    for(const o of allObs)if(o.container===this.container)this._obsBounce(o.cx,o.cy,o.half,o.rotAngle);
    for(const sw of sweepers)if(sw.container===this.container)for(const c of sw.cells)this._obsBounce(c.x,c.y,sw.cellHalf,sw.rotAngle);
  }
  _wallBounce(b){
    const r=this.r;
    if(this.pos.x-r<b.left){this.pos.x=b.left+r;this.vel.x=Math.abs(this.vel.x)*BOUNCE_WALL;}
    if(this.pos.x+r>b.right){this.pos.x=b.right-r;this.vel.x=-Math.abs(this.vel.x)*BOUNCE_WALL;}
    if(this.pos.y-r<b.top){this.pos.y=b.top+r;this.vel.y=Math.abs(this.vel.y)*BOUNCE_WALL;}
    if(this.pos.y+r>b.bottom){this.pos.y=b.bottom-r;this.vel.y=-Math.abs(this.vel.y)*FLOOR_BOUNCE;this.vel.x*=0.92;}
  }
  _obsBounce(cx,cy,h,angle){
    const dx=this.pos.x-cx,dy=this.pos.y-cy;
    const ca=Math.cos(angle),sa=Math.sin(angle);
    const p0=dx*ca+dy*sa,p1=-dx*sa+dy*ca;
    const ov0=h+this.r-Math.abs(p0),ov1=h+this.r-Math.abs(p1);
    if(ov0<=0||ov1<=0)return;
    let nx,ny,pen;
    if(ov0<ov1){const s=p0>=0?1:-1;nx=s*ca;ny=s*sa;pen=ov0;}
    else{const s=p1>=0?1:-1;nx=-s*sa;ny=s*ca;pen=ov1;}
    this.pos.x+=nx*pen;this.pos.y+=ny*pen;
    const dot=this.vel.x*nx+this.vel.y*ny;
    this.vel.x=(this.vel.x-2*dot*nx)*BOUNCE_OBS;
    this.vel.y=(this.vel.y-2*dot*ny)*BOUNCE_OBS;
  }
  draw(ctx){
    if(this.state==='dead')return;
    for(let i=0;i<this.trail.length;i++){
      const p=this.trail[i],a=(i/this.trail.length)*0.55,r=Math.max(this.r*(i/this.trail.length)*0.8,1);
      ctx.save();ctx.globalAlpha=a;ctx.fillStyle=GREEN;ctx.shadowBlur=5;ctx.shadowColor=GREEN;
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    ctx.save();ctx.shadowBlur=18;ctx.shadowColor=GREEN;ctx.fillStyle=GREEN;
    ctx.beginPath();ctx.arc(this.pos.x,this.pos.y,this.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.arc(this.pos.x-2,this.pos.y-2,this.r*0.38,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ── Obstacle（旋转+上下振动）──────────────────────────────────────────────
class Obstacle{
  // minY/maxY 决定上下运动全范围，yBase取中点，oscAmp取半幅
  constructor(cx,cy,half,container,rotSpeed,minY,maxY,oscSpeed=0.006){
    this.cx=cx;this.half=half;this.container=container;
    this.rotAngle=Math.PI/4;this.rotSpeed=rotSpeed;
    this.minY=minY;this.maxY=maxY;
    this.yBase=(minY+maxY)/2;
    this.oscAmp=(maxY-minY)/2;
    this.cy=cy; // 初始位置用传入值
    this.oscPhase=Math.random()*Math.PI*2;
    this.oscSpeed=oscSpeed+(Math.random()-0.5)*0.002;
  }
  update(){
    this.rotAngle+=this.rotSpeed;
    this.oscPhase+=this.oscSpeed;
    this.cy=this.yBase+Math.sin(this.oscPhase)*this.oscAmp;
  }
  draw(ctx){
    ctx.save();ctx.translate(this.cx,this.cy);ctx.rotate(this.rotAngle);
    const s=this.half*Math.SQRT2;
    ctx.fillStyle='#1e1e1e';ctx.strokeStyle=GREEN_DIM;ctx.lineWidth=1.5;
    ctx.shadowBlur=7;ctx.shadowColor=GREEN_DIM;
    ctx.beginPath();ctx.rect(-s/2,-s/2,s,s);ctx.fill();ctx.stroke();
    ctx.fillStyle=GREEN_DIM;ctx.beginPath();ctx.arc(s/2-1,0,2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ── Sweeper（铺满水平线）────────────────────────────────────────────────
class Sweeper{
  constructor(container,yPos){
    this.container=container;this.yPos=yPos;
    this.offset=0;this.speed=1.4;
    this.cellHalf=10;this.gap=38;
    this.count=Math.ceil(W/38)+3;
    this.rotAngle=0;this.rotSpeed=0.18;
    this.cells=[];this.active=true;
  }
  update(){
    if(!this.active)return;
    this.offset=(this.offset+this.speed)%this.gap;
    this.rotAngle+=this.rotSpeed;
    this.cells=[];
    for(let i=0;i<this.count;i++)this.cells.push({x:i*this.gap+this.offset-this.gap,y:this.yPos});
  }
  draw(ctx){
    if(!this.active)return;
    ctx.save();ctx.strokeStyle='rgba(0,200,60,0.22)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,this.yPos);ctx.lineTo(W,this.yPos);ctx.stroke();ctx.restore();
    for(const cell of this.cells){
      if(cell.x<-this.cellHalf*2||cell.x>W+this.cellHalf*2)continue;
      ctx.save();ctx.translate(cell.x,cell.y);ctx.rotate(this.rotAngle);
      const s=this.cellHalf*Math.SQRT2;
      ctx.fillStyle='#232323';ctx.strokeStyle='#00cc44';ctx.lineWidth=1.5;
      ctx.shadowBlur=8;ctx.shadowColor='#00cc44';
      ctx.beginPath();ctx.rect(-s/2,-s/2,s,s);ctx.fill();ctx.stroke();
      ctx.restore();
    }
  }
}

// ── Pipe（管道：弹珠匀速流动）────────────────────────────────────────────
class Pipe{
  constructor(p0,cp1,cp2,p3Fn){
    this.p0=p0;this.cp1=cp1;this.cp2=cp2;
    this.p3Fn=p3Fn; // 动态终点函数，每帧调用
    this.flowing=[];  // [{t:0..1}]
    this.speed=0.007; // 每帧进度（≈143帧≈2.4s）
    this.visible=false;
  }
  addMarble(){this.flowing.push({t:0});}
  // 返回本帧到达终点的数量
  update(){
    for(const m of this.flowing)m.t+=this.speed;
    const done=this.flowing.filter(m=>m.t>=1).length;
    this.flowing=this.flowing.filter(m=>m.t<1);
    return done;
  }
  bezierPos(t){
    const p3=this.p3Fn();
    const it=1-t;
    // 动态cp2（随p3变化）
    const cp2=this.cp2Fn?this.cp2Fn():this.cp2;
    return{
      x:it*it*it*this.p0.x+3*it*it*t*this.cp1.x+3*it*t*t*cp2.x+t*t*t*p3.x,
      y:it*it*it*this.p0.y+3*it*it*t*this.cp1.y+3*it*t*t*cp2.y+t*t*t*p3.y
    };
  }
  draw(ctx){
    if(!this.visible&&this.flowing.length===0)return;
    const p3=this.p3Fn();
    const cp2=this.cp2Fn?this.cp2Fn():this.cp2;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(this.p0.x,this.p0.y);
    ctx.bezierCurveTo(this.cp1.x,this.cp1.y,cp2.x,cp2.y,p3.x,p3.y);
    // 管壁外层
    ctx.strokeStyle='rgba(0,60,20,0.7)';ctx.lineWidth=16;ctx.lineCap='round';ctx.stroke();
    // 管壁内层高光
    ctx.strokeStyle='rgba(0,180,70,0.25)';ctx.lineWidth=10;ctx.stroke();
    // 中心发光线
    ctx.shadowBlur=8;ctx.shadowColor=GREEN;
    ctx.strokeStyle='rgba(0,255,102,0.55)';ctx.lineWidth=2.5;ctx.stroke();
    ctx.shadowBlur=0;
    // 流动弹珠
    for(const m of this.flowing){
      const pos=this.bezierPos(m.t);
      ctx.shadowBlur=14;ctx.shadowColor=GREEN;
      ctx.fillStyle=GREEN;
      ctx.beginPath();ctx.arc(pos.x,pos.y,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.beginPath();ctx.arc(pos.x-2,pos.y-2,3,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

// ── TargetZone ───────────────────────────────────────────────────────────
class TargetZone{
  constructor(idx,count,label,type,container,tgtY){
    this.idx=idx;this.count=count;this.label=label;this.type=type;this.container=container;
    const slotW=W/count;
    this.x=idx*slotW;this.w=slotW;this.y=tgtY;this.h=TGT_ZONE_H;
    this.cx=this.x+slotW/2;this.cy=tgtY+TGT_ZONE_H/2;
    this.pulse=0;this.hitFlash=0;this.active=true;
  }
  update(){this.pulse+=0.06;if(this.hitFlash>0)this.hitFlash--;}
  checkHit(marble){
    if(!this.active||marble.state!=='active'||marble.hitCD>0)return false;
    const mx=marble.pos.x,my=marble.pos.y,r=marble.r;
    return mx+r>this.x&&mx-r<this.x+this.w&&my+r>this.y&&my-r<this.y+this.h;
  }
  triggerFlash(){this.hitFlash=20;}
  draw(ctx){
    const flash=this.hitFlash>0;
    const alpha=flash?0.9:(0.35+0.15*Math.sin(this.pulse));
    ctx.save();
    const grad=ctx.createLinearGradient(this.x,this.y,this.x,this.y+this.h);
    grad.addColorStop(0,`rgba(0,255,102,${alpha*0.6})`);
    grad.addColorStop(1,`rgba(0,255,102,${alpha*0.15})`);
    ctx.fillStyle=grad;ctx.fillRect(this.x+1,this.y,this.w-2,this.h);
    ctx.strokeStyle=flash?'#ffffff':GREEN;ctx.lineWidth=flash?2.5:1.5;
    ctx.shadowBlur=flash?20:10;ctx.shadowColor=GREEN;
    ctx.strokeRect(this.x+1,this.y,this.w-2,this.h);
    ctx.strokeStyle=flash?'rgba(255,255,255,0.9)':`rgba(0,255,102,${0.5+0.4*Math.sin(this.pulse)})`;
    ctx.lineWidth=2;ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(this.x+2,this.y);ctx.lineTo(this.x+this.w-2,this.y);ctx.stroke();
    ctx.fillStyle=flash?'#ffffff':GREEN;ctx.font='bold 13px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=flash?16:8;ctx.shadowColor=GREEN;
    ctx.fillText(this.label,this.cx,this.cy);
    ctx.restore();
  }
}

// ── Launcher ─────────────────────────────────────────────────────────────
class Launcher{
  constructor(x,y,container){
    this.x=x;this.y=y;this.container=container;
    // 仰角15°~85°（Canvas中向右上方：负角度）
    this.angleMin=-Math.PI*85/180;  // -85°（接近竖直向上）
    this.angleMax=-Math.PI*15/180;  // -15°（接近水平向右上）
    this.angle=this.angleMin;       // 从最大仰角开始
    this.angleDir=1;
    this.angleSpeed=0.013;
    this.fireTimer=FIRE_INT*0.35;this.barrelLen=26;this.active=true;
  }
  update(){
    if(!this.active)return;
    this.angle+=this.angleDir*this.angleSpeed;
    if(this.angle>=this.angleMax){this.angle=this.angleMax;this.angleDir=-1;}
    if(this.angle<=this.angleMin){this.angle=this.angleMin;this.angleDir=1;}
    if(this.fireTimer>0)this.fireTimer--;
  }
  shouldFire(){return this.active&&this.fireTimer<=0;}
  resetTimer(iv=FIRE_INT){this.fireTimer=iv;}
  createMarble(aOff=0){
    const a=this.angle+aOff;
    const tx=this.x+Math.cos(a)*(this.barrelLen+2);
    const ty=this.y+Math.sin(a)*(this.barrelLen+2);
    return new Marble(tx,ty,Math.cos(a)*FIRE_SPEED,Math.sin(a)*FIRE_SPEED,this.container);
  }
  draw(ctx){
    const tx=this.x+Math.cos(this.angle)*this.barrelLen;
    const ty=this.y+Math.sin(this.angle)*this.barrelLen;
    ctx.save();
    ctx.shadowBlur=14;ctx.shadowColor=GREEN;ctx.strokeStyle=GREEN;ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.fillStyle='#102010';ctx.strokeStyle=GREEN;ctx.lineWidth=2.5;ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(this.x,this.y,14,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=GREEN;ctx.shadowBlur=4;
    ctx.beginPath();ctx.arc(this.x,this.y,5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ── FloatingNotification ──────────────────────────────────────────────────
class FloatingNotification{
  constructor(text,x,y,color=GREEN){this.text=text;this.x=x;this.y=y;this.color=color;this.alpha=1;this.vy=-2.2;}
  update(){this.y+=this.vy;this.alpha-=0.022;this.vy*=0.96;}
  isDone(){return this.alpha<=0;}
  draw(ctx){
    ctx.save();ctx.globalAlpha=Math.max(0,this.alpha);ctx.fillStyle=this.color;
    ctx.shadowBlur=10;ctx.shadowColor=this.color;ctx.font='bold 15px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.text,this.x,this.y);ctx.restore();
  }
}

// ── 单位图标 ─────────────────────────────────────────────────────────────
function drawClaw(ctx,s=1){ctx.save();ctx.scale(s,s);ctx.strokeStyle=GREEN;ctx.lineWidth=2.5;ctx.lineCap='round';for(let i=-1;i<=1;i++){const a=-Math.PI/2+i*0.38;ctx.beginPath();ctx.moveTo(0,4);ctx.quadraticCurveTo(Math.cos(a)*7+i*3,Math.sin(a)*8,Math.cos(a)*17,Math.sin(a)*19);ctx.stroke();}ctx.fillStyle=GREEN_DIM;ctx.beginPath();ctx.arc(0,4,4.5,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawHead(ctx,r,s=1){ctx.save();ctx.scale(s,s);ctx.strokeStyle=GREEN;ctx.fillStyle='#0a1a0a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=GREEN;ctx.beginPath();ctx.arc(-r*.32,-r*.12,r*.16,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(r*.32,-r*.12,r*.16,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,r*.18,r*.38,.18,Math.PI-.18);ctx.stroke();ctx.restore();}
function drawHumanoid(ctx,s=1){ctx.save();ctx.scale(s,s);ctx.strokeStyle=GREEN;ctx.lineWidth=1.8;ctx.fillStyle='#0a1a0a';ctx.beginPath();ctx.arc(0,-15,6,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillRect(-5,-7,10,12);ctx.strokeRect(-5,-7,10,12);ctx.beginPath();ctx.moveTo(-5,-5);ctx.lineTo(-11,2);ctx.moveTo(5,-5);ctx.lineTo(11,2);ctx.moveTo(-3,5);ctx.lineTo(-5,15);ctx.moveTo(3,5);ctx.lineTo(5,15);ctx.stroke();ctx.fillStyle=GREEN;ctx.beginPath();ctx.arc(-2,-16,1.6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(2,-16,1.6,0,Math.PI*2);ctx.fill();ctx.restore();}

// ── GameState ─────────────────────────────────────────────────────────────
class GameState{
  constructor(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this.marbles=[];this.notifications=[];
    this.buffCount=0;this.unitCounts=[0,0,0,0];
    this.bottomVisible=false;this.bottomSlideY=BOT_H;
    this.weaponHit=false;this.lastTime=0;
    this.topBounds={left:10,right:W-10,top:10,bottom:TOP_FLOOR};
    this.botBounds={left:10,right:W-10,top:TOP_H+10,bottom:BOT_FLOOR};
    this._build();
  }

  _build(){
    // 发射器（角速度已减半）
    this.topLauncher=new Launcher(28,108,'top');
    this.botLauncher=new Launcher(28,TOP_H+100,'bottom');
    this.botLauncher.active=false;

    // 障碍物全范围振动：minY=容器顶部内侧，maxY=sweeper线上方
    const TOP_MIN=20, TOP_MAX=OBS_MAX_TOP;       // 20 ~ 167
    const BOT_MIN=TOP_H+20, BOT_MAX=OBS_MAX_BOT; // 275 ~ 413
    this.obstacles=[
      // 上容器（x位置错开，初始y随机散布）
      new Obstacle(160, 90,14,'top',+0.035,TOP_MIN,TOP_MAX,0.006),
      new Obstacle(320, 60,14,'top',-0.042,TOP_MIN,TOP_MAX,0.008),
      new Obstacle(480,140,14,'top',+0.047,TOP_MIN,TOP_MAX,0.007),
      new Obstacle(220,155,13,'top',-0.038,TOP_MIN,TOP_MAX,0.005),
      // 下容器
      new Obstacle(180,TOP_H+80, 13,'bottom',+0.043,BOT_MIN,BOT_MAX,0.007),
      new Obstacle(380,TOP_H+130,13,'bottom',-0.038,BOT_MIN,BOT_MAX,0.006),
      new Obstacle(560,TOP_H+70, 13,'bottom',+0.045,BOT_MIN,BOT_MAX,0.008),
    ];

    // sweeper行
    this.sweepers=[
      new Sweeper('top',   SWEEP_TOP_Y),
      new Sweeper('bottom',SWEEP_BOT_Y),
    ];
    this.sweepers[1].active=false;

    // 上容器目标区
    this.topZones=[
      new TargetZone(0,3,'WEAPON','weapon','top',  TOP_TGT_Y),
      new TargetZone(1,3,'SPLIT', 'split', 'top',  TOP_TGT_Y),
      new TargetZone(2,3,'GIANT', 'buff',  'top',  TOP_TGT_Y),
    ];
    // 下容器目标区
    this.botZones=[
      new TargetZone(0,4,'①','unit1','bottom',BOT_TGT_Y),
      new TargetZone(1,4,'②','unit2','bottom',BOT_TGT_Y),
      new TargetZone(2,4,'③','unit3','bottom',BOT_TGT_Y),
      new TargetZone(3,4,'④','unit4','bottom',BOT_TGT_Y),
    ];
    this.unitCosts=[1,2,5,15];
    this.unitDrawFns=[(ctx)=>drawClaw(ctx,1.5),(ctx)=>drawHead(ctx,14,1),(ctx)=>drawHead(ctx,18,1),(ctx)=>drawHumanoid(ctx,1.2)];

    // ── 管道（沿两容器分隔线区域走，Y形分叉）──────────────────────────────
    // WEAPON管道：从WEAPON区弯下至分隔线 → 穿越分隔线入容器2 → 到发射器
    this.weaponPipe=new Pipe(
      {x:117, y:TOP_TGT_Y},    // P0: WEAPON区顶部入口
      {x:80,  y:TOP_H-4},      // CP1: 弧线弯向分隔线左侧
      null,                     // CP2: 动态
      ()=>({x:28, y:TOP_H+100+this.bottomSlideY}) // P3: 容器2发射器
    );
    this.weaponPipe.cp2Fn=()=>({x:20, y:TOP_H+20+this.bottomSlideY*0.5});
    this.weaponPipe.visible=true;

    // SPLIT管道：从SPLIT区弯下至分隔线 → 沿底部内边距向左 → 回到容器1发射器
    this.splitPipe=new Pipe(
      {x:350, y:TOP_TGT_Y},  // P0: SPLIT区顶部入口
      {x:200, y:TOP_H-4},    // CP1: 向左下弯至分隔线内侧
      {x:20,  y:TOP_H-10},   // CP2: 沿容器1底部内边距向左
      ()=>({x:this.topLauncher.x, y:this.topLauncher.y}) // P3: 容器1发射器
    );
    this.splitPipe.visible=true;

    this.deferredPipes=[];
  }

  // ── 触发事件 ──────────────────────────────────────────────────────────
  onBuff(x,y){
    this.buffCount++;
    this.notifications.push(new FloatingNotification('+GIANT',x,y));
  }
  onWeapon(marble){
    marble.state='dead';
    if(!this.weaponHit){
      this.weaponHit=true;
      this.bottomVisible=true;this.bottomSlideY=BOT_H;
    }
    this.weaponPipe.addMarble();
    this.notifications.push(new FloatingNotification('WEAPON→',marble.pos.x,marble.pos.y,'#ff8800'));
  }
  onSplit(marble){
    marble.state='dead';
    this.splitPipe.addMarble();                                       // 第1枚立即入管
    this.deferredPipes.push({pipe:this.splitPipe,framesLeft:30});     // 第2枚30帧后入管
    this.notifications.push(new FloatingNotification('SPLIT×2',marble.pos.x,marble.pos.y,'#ffff00'));
  }
  onUnit(i,x,y){
    this.unitCounts[i]++;
    this.notifications.push(new FloatingNotification('+'+this.unitCosts[i],x,y-20,'#ffffff'));
  }

  // ── 主循环 ────────────────────────────────────────────────────────────
  start(){
    this.lastTime=performance.now();
    const loop=(ts)=>{this.lastTime=ts;this.update();this.render();requestAnimationFrame(loop);};
    requestAnimationFrame(loop);
  }

  update(){
    // 上容器发射器（自动发射，无数量上限）
    this.topLauncher.update();
    if(this.topLauncher.shouldFire()){this.topLauncher.resetTimer();this.marbles.push(this.topLauncher.createMarble());}

    // 下容器发射器（只振动，不自动发射）
    this.botLauncher.update();

    // 障碍物振动+旋转
    for(const o of this.obstacles)o.update();
    for(const sw of this.sweepers)sw.update();

    // 下容器滑入
    if(this.bottomVisible){
      this.bottomSlideY+=(0-this.bottomSlideY)*0.11;
      if(this.bottomSlideY<0.8)this.bottomSlideY=0;
      if(this.bottomSlideY<8&&!this.botLauncher.active){
        this.botLauncher.active=true;
        this.sweepers[1].active=true;
      }
    }

    // 管道更新：到达终点的弹珠触发发射
    const weaponArrived=this.weaponPipe.update();
    for(let i=0;i<weaponArrived;i++)this.marbles.push(this.botLauncher.createMarble());

    const splitArrived=this.splitPipe.update();
    for(let i=0;i<splitArrived;i++)this.marbles.push(this.topLauncher.createMarble());

    // 弹珠物理
    for(const m of this.marbles)m.update(this.obstacles,this.sweepers,this.topBounds,this.botBounds);

    // 目标区碰撞检测
    for(const m of this.marbles){
      if(m.state!=='active'||m.hitCD>0)continue;
      if(m.container==='top'){
        for(const z of this.topZones){
          if(z.checkHit(m)){
            z.triggerFlash();
            if(z.type==='buff'){m.state='dead';this.onBuff(m.pos.x,m.pos.y);}

            else if(z.type==='weapon')this.onWeapon(m);
            else if(z.type==='split')this.onSplit(m);
            break;
          }
        }
      }else{
        // 只有进入容器2目标区弹珠才消失
        for(let i=0;i<this.botZones.length;i++){
          const z=this.botZones[i];
          if(z.checkHit(m)){m.state='dead';z.triggerFlash();this.onUnit(i,z.cx,z.cy);break;}
        }
      }
    }

    // 延迟管道入队（SPLIT第2枚）
    for(const d of this.deferredPipes){d.framesLeft--;if(d.framesLeft<=0)d.pipe.addMarble();}
    this.deferredPipes=this.deferredPipes.filter(d=>d.framesLeft>0);

    // 清理
    this.marbles=this.marbles.filter(m=>m.state!=='dead');
    for(const z of this.topZones)z.update();
    for(const z of this.botZones)z.update();
    for(const n of this.notifications)n.update();
    this.notifications=this.notifications.filter(n=>!n.isDone());
  }

  render(){
    const ctx=this.ctx;
    ctx.clearRect(0,0,W,H);

    // 上容器
    ctx.save();ctx.fillStyle='#111111';ctx.fillRect(0,0,W,TOP_H);
    this._drawTop(ctx);ctx.restore();

    // 下容器（clip+translate滑入）
    if(this.bottomVisible){
      ctx.save();
      ctx.beginPath();ctx.rect(0,TOP_H,W,BOT_H);ctx.clip();
      ctx.translate(0,this.bottomSlideY);
      this._drawBot(ctx);ctx.restore();
    }

    // 管道（全局坐标，覆盖两个容器）
    this.weaponPipe.draw(ctx);
    this.splitPipe.draw(ctx);

    // 弹珠
    for(const m of this.marbles)m.draw(ctx);

    // 通知
    for(const n of this.notifications)n.draw(ctx);

    // HUD
    this._drawHUD(ctx);
  }

  _drawTop(ctx){
    this.sweepers[0].draw(ctx);
    for(const o of this.obstacles)if(o.container==='top')o.draw(ctx);
    for(const z of this.topZones)z.draw(ctx);
    this.topLauncher.draw(ctx);
    ctx.save();ctx.strokeStyle=GREEN;ctx.lineWidth=2.5;ctx.shadowBlur=10;ctx.shadowColor=GREEN;
    ctx.beginPath();ctx.moveTo(0,TOP_H-1);ctx.lineTo(W,TOP_H-1);ctx.stroke();ctx.restore();
    this._border(ctx,0,0,W,TOP_H);
  }

  _drawBot(ctx){
    ctx.fillStyle='#0f180f';ctx.fillRect(0,TOP_H,W,BOT_H);
    ctx.save();ctx.fillStyle='#071207';ctx.strokeStyle=GREEN;ctx.lineWidth=1.5;
    ctx.shadowBlur=8;ctx.shadowColor=GREEN;
    ctx.fillRect(6,TOP_H+5,80,22);ctx.strokeRect(6,TOP_H+5,80,22);
    ctx.fillStyle=GREEN;ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('WEAPON',46,TOP_H+16);ctx.restore();
    this.sweepers[1].draw(ctx);
    for(const o of this.obstacles)if(o.container==='bottom')o.draw(ctx);
    this._drawUnitSlots(ctx);
    this.botLauncher.draw(ctx);
    this._border(ctx,0,TOP_H,W,BOT_H);
  }

  _drawUnitSlots(ctx){
    const slotW=W/4;
    for(let i=0;i<4;i++){
      const sx=i*slotW,cx=sx+slotW/2;
      ctx.save();ctx.fillStyle='rgba(0,35,8,0.5)';ctx.fillRect(sx+2,TOP_H+28,slotW-4,BOT_TGT_Y-TOP_H-30);
      ctx.strokeStyle='rgba(0,255,102,0.18)';ctx.lineWidth=1;ctx.strokeRect(sx+2,TOP_H+28,slotW-4,BOT_TGT_Y-TOP_H-30);
      ctx.translate(cx,TOP_H+115);ctx.shadowBlur=10;ctx.shadowColor=GREEN;
      ctx.globalAlpha=this.botZones[i].hitFlash>0?1:0.72;
      this.unitDrawFns[i](ctx);ctx.restore();
      ctx.save();ctx.fillStyle=this.botZones[i].hitFlash>0?'#ffffff':GREEN;
      ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.shadowBlur=10;ctx.shadowColor=GREEN;ctx.fillText(this.unitCounts[i],cx,TOP_H+178);
      ctx.fillStyle='#446644';ctx.font='10px monospace';ctx.fillText(this.unitCosts[i],sx+slotW-12,TOP_H+32);
      ctx.restore();
      this.botZones[i].draw(ctx);
    }
  }

  _border(ctx,x,y,w,h){
    ctx.save();ctx.strokeStyle=GREEN;ctx.lineWidth=2;ctx.shadowBlur=10;ctx.shadowColor=GREEN;
    ctx.strokeRect(x+1,y+1,w-2,h-2);ctx.restore();
  }

  _drawHUD(ctx){
    ctx.save();ctx.shadowBlur=14;ctx.shadowColor=GREEN;ctx.fillStyle=GREEN;
    ctx.font='bold 30px monospace';ctx.textAlign='right';ctx.textBaseline='top';
    ctx.fillText(this.buffCount,W-12,8);
    ctx.fillStyle='#447744';ctx.font='10px monospace';ctx.fillText('GIANT',W-12,42);ctx.restore();
    ctx.save();ctx.strokeStyle=GREEN;ctx.lineWidth=2;ctx.shadowBlur=8;ctx.shadowColor=GREEN;
    ctx.beginPath();ctx.arc(W-18,TOP_H/2,11,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=GREEN_DIM;ctx.beginPath();ctx.arc(W-18,TOP_H/2,5,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

const game=new GameState(document.getElementById('c'));
game.start();

// ── 频率控制面板 ──────────────────────────────────────────────────────────
(function(){
  const slider=document.getElementById('freq-slider');
  const valLbl=document.getElementById('freq-val');
  const btnSlow=document.getElementById('btn-slow');
  const btnFast=document.getElementById('btn-fast');
  function apply(v){
    v=Math.max(60,Math.min(480,v));FIRE_INT=v;
    slider.value=v;valLbl.textContent=(v/60).toFixed(1)+' s';
  }
  slider.addEventListener('input',()=>apply(+slider.value));
  btnSlow.addEventListener('click',()=>apply(FIRE_INT+20));
  btnFast.addEventListener('click',()=>apply(FIRE_INT-20));
  apply(180);
})();
</script>
