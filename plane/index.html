<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷霆战机 - Thunder Strike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <div class="screen-content">
                <div class="title-wrapper">
                    <div class="title-sub">THUNDER STRIKE</div>
                    <h1 class="title-main">雷霆战机</h1>
                    <div class="title-line"></div>
                </div>
                <div class="control-hint">
                    <span class="key">↑↓←→</span><span class="sep">/</span><span class="key">WASD</span> 移动
                    <span class="key">SPACE</span> 射击
                    <span class="key">B</span> 呼叫支援
                    <span class="key">P</span> 暂停
                </div>
                <button id="startBtn" class="btn-primary">开始游戏</button>
                <div class="difficulty-select">
                    <span class="diff-label">难度：</span>
                    <button class="diff-btn active" data-diff="1">普通</button>
                    <button class="diff-btn" data-diff="2">困难</button>
                    <button class="diff-btn" data-diff="3">地狱</button>
                </div>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-left">
                <div class="hud-item">
                    <span class="hud-label">SCORE</span>
                    <span id="scoreDisplay" class="hud-value">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">LEVEL</span>
                    <span id="levelDisplay" class="hud-value">1</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">SUPPORT</span>
                    <span id="supportDisplay" class="hud-value support-val">0</span>
                </div>
            </div>
            <div class="hud-center">
                <div id="powerupDisplay" class="powerup-indicator hidden"></div>
            </div>
            <div class="hud-right">
                <div class="hud-item">
                    <span class="hud-label">LIVES</span>
                    <span id="livesDisplay" class="hud-value lives-val">10 / 10</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">SHIELD</span>
                    <div class="shield-bar">
                        <div id="shieldBar" class="shield-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pauseScreen" class="screen hidden">
            <div class="screen-content">
                <h2 class="pause-title">PAUSED</h2>
                <button id="resumeBtn" class="btn-primary">继续游戏</button>
                <button id="restartFromPauseBtn" class="btn-secondary">重新开始</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <div class="screen-content">
                <h2 class="game-over-title">GAME OVER</h2>
                <div class="final-stats">
                    <div class="stat-row">
                        <span>最终分数</span>
                        <span id="finalScore">0</span>
                    </div>
                    <div class="stat-row">
                        <span>到达关卡</span>
                        <span id="finalLevel">1</span>
                    </div>
                    <div class="stat-row">
                        <span>击毁敌机</span>
                        <span id="finalKills">0</span>
                    </div>
                </div>
                <button id="playAgainBtn" class="btn-primary">再来一局</button>
                <button id="mainMenuBtn" class="btn-secondary">主菜单</button>
            </div>
        </div>

        <!-- Level Up Notification -->
        <div id="levelUpNotif" class="level-notif hidden">
            <div class="level-notif-text">LEVEL UP!</div>
            <div class="level-notif-num" id="levelNotifNum"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
